<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Verificação de segurança</title>
  <!--
    =====================================================================
    PORTÃO DE VERIFICAÇÃO (entrada do funil)
    Mostra a tela "Verificando se você é humano...", barra bots e
    desktop, e redireciona o visitante aprovado para o pressel.
    =====================================================================
    ONDE EDITAR:

    1. DESTINO: variável destinationUrl no <script> no fim da página
       (hoje aponta para emprestimo.html, o pressel).

    2. TAG DO GOOGLE ADS: cole sua tag base (gtag.js) no bloco marcado
       abaixo quando for subir a campanha.

    3. PRA TESTAR NO COMPUTADOR: abra com ?preview no fim da URL
       (ex.: http://127.0.0.1:8000/?preview), senão a tela trava em
       "Acesso disponível apenas pelo celular".
    =====================================================================
  -->

  <!-- Captura de UTMs e gclid (primeiro toque) -->
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var keys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid'];
      var fresh = {};
      keys.forEach(function (k) { var v = p.get(k); if (v) fresh[k] = v; });
      if (Object.keys(fresh).length) { try { sessionStorage.setItem('_utms', JSON.stringify(fresh)); } catch (e) {} }
    })();
  </script>

  <!-- Utmify: captura utm_*/gclid ja na entrada do funil -->
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>

  <!--
    TAG DO GOOGLE ADS: quando criar a conta/campanha, cole aqui a tag
    base (gtag.js) com o seu AW-XXXXXXXXXX. Sem conversão nesta página,
    a conversão se mede no destino final.
  -->

  <style>
    :root { --bg:#F2F2F2; --surface:#fff; --text:#111111; --muted:#666666; --line:#D9D9D9; --accent:#2B2B2B; --accent-dark:#1A1A1A; --danger:#c2410c; --success:#22c55e; --shadow:0 24px 70px rgba(0,0,0,.28); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:linear-gradient(135deg,#000000 0%,#1A1A1A 50%,#2B2B2B 100%); }
    .verification { width:min(100%,460px); padding:34px 28px 30px; border:1px solid rgba(255,255,255,.1); border-radius:24px; background:rgba(255,255,255,.97); box-shadow:var(--shadow); text-align:center; backdrop-filter:blur(14px); }
    .brand-mark { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 22px; border-radius:18px; color:#fff; background:linear-gradient(135deg,#3A3A3A,#111111); box-shadow:rgba(0,0,0,.45) 0 14px 30px; }
    .brand-mark svg { width:30px; height:30px; }
    h1 { margin-bottom:10px; font-size:clamp(1.55rem,4vw,2rem); line-height:1.16; }
    p { max-width:34ch; margin:0 auto; color:var(--muted); font-size:1rem; line-height:1.55; }
    .loader { width:74px; height:74px; position:relative; margin:30px auto 24px; }
    .loader::before, .loader::after { content:""; position:absolute; inset:0; border-radius:50%; }
    .loader::before { border:5px solid #D9D9D9; }
    .loader::after { border-width:5px; border-style:solid; border-bottom-color:transparent; border-left-color:transparent; border-top-color:#2B2B2B; border-right-color:#2B2B2B; animation:.9s linear 0s infinite spin; }
    .loader.is-complete::before { border-color:rgba(42,42,42,.18); background:rgba(42,42,42,.07); }
    .loader.is-complete::after { width:28px; height:14px; inset:24px 0 0 21px; border-top:0; border-right:0; border-left:5px solid var(--success); border-bottom:5px solid var(--success); border-radius:0; animation:.28s ease 0s 1 forwards checkIn; }
    .status { min-height:24px; color:var(--text); font-size:.95rem; font-weight:600; }
    .status.is-error { color:var(--danger); }
    .progress { height:8px; overflow:hidden; margin-top:22px; border-radius:999px; background:#D9D9D9; }
    .progress span { display:block; width:0%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#1A1A1A,#666666); transition:width .25s; }
    .challenge { display:none; margin-top:20px; padding:14px; border:1px solid var(--line); border-radius:14px; background:#F2F2F2; text-align:left; }
    .challenge.is-visible { display:block; }
    .challenge label { display:block; margin-bottom:8px; color:var(--text); font-size:.9rem; font-weight:700; }
    .challenge-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
    .challenge input { width:100%; min-height:46px; padding:0 12px; border:1px solid var(--line); border-radius:12px; color:var(--text); background:#fff; font:700 1rem Inter,system-ui,sans-serif; }
    .challenge input:focus { outline:2px solid #3A3A3A; outline-offset:1px; }
    .challenge button, .continue-button { min-height:46px; border:0; border-radius:12px; color:#fff; background:linear-gradient(135deg,#3A3A3A,#111111); cursor:pointer; font:800 .95rem Inter,system-ui,sans-serif; }
    .challenge button:hover { background:linear-gradient(135deg,#2B2B2B,#000000); }
    .challenge button { padding:0 16px; }
    .continue-button { width:100%; min-height:52px; display:none; align-items:center; justify-content:center; gap:10px; margin-top:22px; box-shadow:rgba(0,0,0,.32) 0 14px 26px; transition:transform .2s, box-shadow .2s; }
    .continue-button:hover { transform:translateY(-1px); box-shadow:rgba(0,0,0,.48) 0 18px 34px; }
    .continue-button.is-visible { display:flex; }
    .footnote { margin-top:18px; color:#666666; font-size:.82rem; }
    noscript { width:min(100%,460px); display:block; margin-top:16px; padding:14px 16px; border:1px solid #fed7aa; border-radius:14px; color:#7c2d12; background:#fff7ed; text-align:center; font:600 .95rem system-ui,sans-serif; }
    @keyframes spin { 100% { transform:rotate(360deg); } }
    @keyframes checkIn { 0% { opacity:0; transform:rotate(-45deg) scale(.78); } 100% { opacity:1; transform:rotate(-45deg) scale(1); } }
    @media (max-width:420px) { body { padding:18px; } .verification { padding:30px 22px 26px; border-radius:20px; } .challenge-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="verification" aria-live="polite">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" role="img">
        <path d="M12 3.25 19 6.4v5.25c0 4.45-2.86 7.95-7 9.1-4.14-1.15-7-4.65-7-9.1V6.4l7-3.15Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
        <path d="m8.7 12.1 2.1 2.1 4.6-4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>

    <h1>Verificando se você é humano...</h1>
    <p>Aguarde alguns segundos para continuar com segurança.</p>

    <div class="loader" id="verificationIcon" aria-label="Carregando"></div>
    <div class="status" id="statusText">Iniciando verificação...</div>
    <div class="progress" aria-hidden="true">
      <span id="progressBar" style="width: 10%;"></span>
    </div>

    <form class="challenge" id="challengeForm" autocomplete="off">
      <label id="challengeLabel" for="challengeAnswer">Para continuar, quanto é 8 + 4?</label>
      <div class="challenge-row">
        <input id="challengeAnswer" name="answer" inputmode="numeric" pattern="[0-9]*" type="text" required="">
        <button type="submit">Validar</button>
      </div>
    </form>

    <button class="continue-button" id="continueButton" type="button">Continuar para o site</button>
    <div class="footnote">Verificação automática em andamento.</div>
  </main>

  <noscript>
    Ative o JavaScript no navegador para continuar acessando o site.
  </noscript>

  <script>
    (function () {
      var destinationUrl = 'https://siteseguro.space';
      var verificationKey = 'humanVerification';
      var maxAge = 6 * 60 * 60 * 1000;
      var minimumDelay = 3200;
      var maximumDelay = 6200;
      var startedAt = Date.now();
      var challengeExpected = null;
      var challengeMode = 'verification';
      var params = new URLSearchParams(window.location.search);
      var isPreview = params.has('preview');
      var statusText = document.getElementById('statusText');
      var progressBar = document.getElementById('progressBar');
      var continueButton = document.getElementById('continueButton');
      var verificationIcon = document.getElementById('verificationIcon');
      var challengeForm = document.getElementById('challengeForm');
      var challengeLabel = document.getElementById('challengeLabel');
      var challengeAnswer = document.getElementById('challengeAnswer');

      function setStatus(message, isError) {
        statusText.textContent = message;
        statusText.classList.toggle('is-error', Boolean(isError));
      }

      function isMobileDevice() {
        if (isPreview) return true;
        var userAgent = navigator.userAgent || navigator.vendor || window.opera || '';
        var mobileUserAgent = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(userAgent);
        var smallViewport = window.matchMedia('(max-width: 820px)').matches;
        var touchPointer = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
        return smallViewport && (mobileUserAgent || touchPointer);
      }

      function goToDestination() {
        var separator = destinationUrl.indexOf('?') === -1 ? '?' : '&';
        var finalUrl = destinationUrl + (params.toString() ? separator + params.toString() : '');
        window.location.replace(finalUrl);
      }

      function hasValidVerification() {
        try {
          var rawVerification = localStorage.getItem(verificationKey);
          var verification = rawVerification ? JSON.parse(rawVerification) : null;
          var verifiedAt = verification && Number(verification.verifiedAt);
          return Boolean(verification && verification.status === 'verified' && verifiedAt && Date.now() - verifiedAt <= maxAge);
        } catch (error) {
          try { localStorage.removeItem(verificationKey); } catch (storageError) { return false; }
          return false;
        }
      }

      function saveVerification() {
        var verifiedAt = Date.now();
        try {
          localStorage.setItem(verificationKey, JSON.stringify({ status: 'verified', verifiedAt: verifiedAt, expiresAt: verifiedAt + maxAge }));
          return true;
        } catch (error) { return false; }
      }

      function hasAutomationSignals() {
        if (isPreview) return false;
        return Boolean(navigator.webdriver || window.callPhantom || window._phantom || window.__nightmare || document.documentElement.getAttribute('webdriver'));
      }

      function showContinueButton() {
        challengeForm.classList.remove('is-visible');
        setStatus('Verificação concluída.', false);
        progressBar.style.width = '100%';
        verificationIcon.classList.add('is-complete');
        verificationIcon.setAttribute('aria-label', 'Verificação concluída');
        continueButton.classList.add('is-visible');
        continueButton.focus();
      }

      function showChallenge(mode) {
        var firstNumber = Math.floor(2 + Math.random() * 8);
        var secondNumber = Math.floor(2 + Math.random() * 8);
        challengeMode = mode || 'verification';
        challengeExpected = firstNumber + secondNumber;
        challengeLabel.textContent = 'Para continuar, quanto é ' + firstNumber + ' + ' + secondNumber + '?';
        challengeAnswer.value = '';
        challengeForm.classList.add('is-visible');
        challengeAnswer.focus();
        if (challengeMode === 'desktop') { setStatus('Acesso disponível apenas pelo celular.', true); return; }
        setStatus('Confirme a verificação abaixo.', false);
      }

      function completeVerification() {
        if (saveVerification()) { showContinueButton(); }
        else { setStatus('Não foi possível salvar a validação neste navegador.', true); }
      }

      if (!statusText || !progressBar || !continueButton || !verificationIcon || !challengeForm) { return; }

      continueButton.addEventListener('click', goToDestination);
      challengeForm.addEventListener('submit', function (event) {
        event.preventDefault();
        if (Number(challengeAnswer.value) === challengeExpected) {
          if (challengeMode === 'desktop') { setStatus('Mesmo com a resposta correta, continue pelo celular.', true); showChallenge('desktop'); return; }
          completeVerification();
          return;
        }
        setStatus('Resposta incorreta. Tente novamente.', true);
        showChallenge(challengeMode);
      });

      if (hasValidVerification() && isMobileDevice()) { showContinueButton(); return; }

      try {
        localStorage.setItem('humanVerificationTest', '1');
        localStorage.removeItem('humanVerificationTest');
      } catch (error) { setStatus('Não foi possível validar este navegador.', true); return; }

      var delay = Math.floor(minimumDelay + Math.random() * (maximumDelay - minimumDelay + 1));
      var messages = [
        { at: 0.24, text: 'Conferindo execução de JavaScript...' },
        { at: 0.52, text: 'Validando sinais do navegador...' },
        { at: 0.82, text: 'Finalizando verificação...' }
      ];
      var messageIndex = 0;

      var timer = window.setInterval(function () {
        var elapsed = Date.now() - startedAt;
        var progress = Math.min(elapsed / delay, 1);
        progressBar.style.width = Math.round(progress * 100) + '%';
        if (messages[messageIndex] && progress >= messages[messageIndex].at) {
          setStatus(messages[messageIndex].text, false);
          messageIndex += 1;
        }
        if (elapsed >= delay) {
          window.clearInterval(timer);
          if (!isMobileDevice()) { showChallenge('desktop'); return; }
          if (hasAutomationSignals() || document.visibilityState !== 'visible') { showChallenge('verification'); return; }
          completeVerification();
        }
      }, 120);
    })();
  </script>
</body>
</html>
